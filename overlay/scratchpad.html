<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' study: data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Study Signal · 스크래치패드</title><link rel="stylesheet" href="scratchpad.css"></head><body><main class="pad"><header><div><span class="eyebrow">STUDY SIGNAL</span><h1>스크래치패드<span class="dot"></span></h1></div><button id="pin" title="항상 위에 표시" aria-label="항상 위에 표시" aria-pressed="true">고정</button><button id="close" aria-label="패드 숨기기">×</button></header><div id="entries" class="entries" aria-live="polite"></div><div id="empty" class="empty"><span class="empty-mark">＋</span><h2>읽다가 떠오른 모든 것.</h2><p>메모와 자료를 여기에 모아두세요.<br>“이거 번역해줘”라고 말하면<br>번역과 요약도 이곳에 정리해요.</p></div><section class="composer"><label for="draft" class="sr-only">자유 메모</label><textarea id="draft" placeholder="적거나 붙여넣으세요…" maxlength="20000"></textarea><div class="compose-actions"><label class="file-button" for="files">파일 넣기<input id="files" type="file" multiple accept=".pdf,.txt,.md,.docx,.png,.jpg,.jpeg,.webp" hidden></label><span id="save-state" role="status">이 Mac에 저장</span><button id="add">메모 추가 <span>⌘↵</span></button></div></section><p id="error" class="error" role="alert" hidden></p><footer>메모·이미지·PDF를 끌어 놓을 수 있어요. 파일은 이 Mac에만 보관해요.</footer></main><script type="module" src="scratchpad.mjs"></script></body></html>
