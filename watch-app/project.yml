name: SleepEnv
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 실기기 설치 시 Apple Developer Team ID를 여기에 넣으세요.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SleepEnv:
    type: application
    platform: iOS
    sources:
      - SleepEnviOS
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimyeeun.SleepEnv
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - target: SleepEnvWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: SleepEnviOS/Info.plist
      properties:
        CFBundleDisplayName: SleepEnv
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: 수면 기록, 심박 변이도, 안정 시 심박을 읽어 이 기기와 Apple Watch에 표시합니다.
    entitlements:
      path: SleepEnviOS/SleepEnv.entitlements
      properties:
        com.apple.developer.healthkit: true

  SleepEnvWatch:
    type: application
    platform: watchOS
    sources:
      - SleepEnvWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimyeeun.SleepEnv.watchkitapp
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreMotion.framework
    info:
      path: SleepEnvWatch/Info.plist
      properties:
        CFBundleDisplayName: SleepEnv
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kimyeeun.SleepEnv
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        NSMotionUsageDescription: 심박 상승이 움직임 때문인지 구분하기 위해 모션 센서를 사용합니다.
        NSHealthShareUsageDescription: 측정 중 실시간 심박수를 읽어 표시합니다.
        NSHealthUpdateUsageDescription: 실시간 심박 측정에 필요한 워크아웃 세션을 사용합니다. 측정이 끝나면 운동 기록은 저장하지 않습니다.
    entitlements:
      path: SleepEnvWatch/SleepEnvWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
