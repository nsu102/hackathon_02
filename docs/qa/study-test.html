<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Signal · 실제 질문 시험 자료</title><style>body{margin:0;background:#f8faf4;color:#162018;font:24px/1.8 system-ui,'Apple SD Gothic Neo',sans-serif}main{max-width:960px;margin:8vh auto;padding:40px}small{font-size:15px;color:#586459}h1{font-size:46px;margin:12px 0 20px}.formula{font-size:38px;border-block:1px solid #cbd5c7;padding:20px 0}p{max-width:820px}strong{color:#354b29}</style><main><small>직접 작성한 테스트 자료 · 개인정보 없음</small><h1>조건부 확률: 분모는 왜 4일까요?</h1><p>상자에 카드가 10장 있습니다.<br>빨간 카드는 4장이고, 그중 별 표시가 있는 카드는 2장입니다.</p><p class="formula">P(별 | 빨강) = P(별 ∩ 빨강) / P(빨강) = 2 / 4</p><p>이미 <strong>빨간 카드라는 조건</strong>이 주어졌다면 빨간 카드 4장이 새로운 전체입니다. 따라서 그중 별 카드일 확률은 2/4입니다.</p><small>시험 질문: “이거 어렵네, 알려줘. 왜 분모가 10이 아니라 4야?”</small></main></html>
